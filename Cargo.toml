[package]
name = "spectroscope"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "EPL-1.0"
description = "Consistency and isolation level checkers for distributed systems testing"
repository = "https://github.com/pcholakov/spectroscope"
documentation = "https://docs.rs/spectroscope"
readme = "README.md"
keywords = ["distributed-systems", "testing", "linearizability", "consistency"]
categories = ["development-tools::testing"]

[dependencies]
ahash = "0.8"

[dev-dependencies]
proptest = "1.5"
rand = "0.9"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
as_conversions = "warn"
# Fires on deliberate pairs such as `stale` and `stable`.
similar_names = "allow"
